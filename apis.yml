name: VDOnet
description: VDOnet Corp was a mid-1990s streaming-media pioneer whose VDOLive server
  and player delivered some of the earliest video streamed over the web, alongside
  the VDOPhone video-telephony product. Backed by Battery Ventures, with Microsoft
  taking a minority stake in 1996, the company wound down in the late 1990s and its
  product line was sold off (Citrix negotiated a purchase of the product line for
  roughly $8 million in 1998). The company is defunct - its former vdo.net domain
  now resolves to a parked page listed for sale - and no API, developer portal, or
  other machine-readable surface exists to harvest.
